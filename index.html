<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAMK AI Project – Space Shooter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="game-header">
      <h1>Space Shooter</h1>
      <button id="music-toggle" type="button" data-music-toggle aria-label="Music" aria-pressed="false">Music: Off</button>
    </header>
    <div id="game-status" class="status" aria-live="polite" hidden>
      <span>Score: <strong id="score">0</strong></span>
      <span>Lives: <strong id="lives">3</strong></span>
    </div>
    <div class="game-stage">
      <div class="play-area">
        <canvas id="game" width="800" height="600" aria-label="Space game area" tabindex="-1"></canvas>
        <div id="main-menu" class="main-menu">
          <nav id="menu-options" aria-label="Main menu">
            <button id="start-game" type="button">Start Game</button>
            <button id="show-how-to-play" type="button">How to Play</button>
            <button type="button" data-music-toggle aria-label="Music" aria-pressed="false">Music: Off</button>
          </nav>
          <section id="how-to-play" aria-labelledby="how-to-play-title" hidden>
            <h2 id="how-to-play-title">How to Play</h2>
            <p>Use WASD or the arrow keys to move. Up and down movement stays near the bottom of the screen. Hold Space to shoot.</p>
            <p>Clear the alien waves and defeat the bosses to survive all three levels.</p>
            <button id="menu-back" type="button">Back</button>
          </section>
        </div>
      </div>
      <aside id="developer-testing" class="developer-panel" aria-labelledby="developer-testing-title" hidden>
        <h2 id="developer-testing-title">Developer testing</h2>
        <div class="developer-level-buttons">
          <button type="button" data-developer-level="1">Level 1</button>
          <button type="button" data-developer-level="2">Level 2</button>
          <button type="button" data-developer-level="3">Level 3</button>
        </div>
        <h2>Boss tests</h2>
        <div class="developer-boss-buttons">
          <button type="button" data-developer-boss="1">Test Boss 1</button>
          <button type="button" data-developer-boss="2">Test Boss 2</button>
          <button type="button" data-developer-boss="3">Test Boss 3</button>
          <button type="button" data-developer-boss="4">Test Boss 4</button>
        </div>
      </aside>
    </div>
    <button id="restart" type="button" hidden>Restart</button>
    <button id="level-2" type="button" hidden>Level 2</button>
    <button id="level-3" type="button" hidden>Level 3</button>
  </main>
  <script src="finalboss-workshop/Varnok%20Artwork%20Workshop%20(complete%20ZIP)/artwork.js"></script>
  <script src="assets/bosses/rooted-crown.js"></script>
  <script src="game.js"></script>
  <script src="music.js"></script>
</body>
</html>
